<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .org { fill: #1a237e; }
    .env { fill: #283593; }
    .region-eu { fill: #00695c; }
    .region-us { fill: #37474f; }
    .shared { fill: #6a1b9a; }
    .project { fill: #ffffff; stroke: #90a4ae; stroke-width: 1.5; }
    .box-text { fill: #ffffff; font-size: 13px; font-weight: 600; }
    .project-text { fill: #263238; font-size: 11px; }
    .label { fill: #607d8b; font-size: 10px; font-style: italic; }
    .line { stroke: #b0bec5; stroke-width: 1.5; fill: none; }
  </style>

  <!-- Org -->
  <rect x="400" y="10" width="200" height="40" rx="6" class="org"/>
  <text x="500" y="35" text-anchor="middle" class="box-text">medsecure.example (Org)</text>

  <!-- Environment folders -->
  <rect x="150" y="90" width="200" height="36" rx="6" class="env"/>
  <text x="250" y="113" text-anchor="middle" class="box-text">Folder: prod</text>

  <rect x="650" y="90" width="200" height="36" rx="6" class="env"/>
  <text x="750" y="113" text-anchor="middle" class="box-text">Folder: non-prod</text>

  <line class="line" x1="500" y1="50" x2="250" y2="90"/>
  <line class="line" x1="500" y1="50" x2="750" y2="90"/>

  <!-- Region folders under prod -->
  <rect x="60" y="170" width="150" height="34" rx="6" class="region-eu"/>
  <text x="135" y="192" text-anchor="middle" class="box-text">Folder: eu</text>

  <rect x="290" y="170" width="150" height="34" rx="6" class="region-us"/>
  <text x="365" y="192" text-anchor="middle" class="box-text">Folder: us</text>

  <line class="line" x1="250" y1="126" x2="135" y2="170"/>
  <line class="line" x1="250" y1="126" x2="365" y2="170"/>

  <!-- Service projects under prod-eu -->
  <rect x="20" y="230" width="105" height="28" rx="4" class="project"/>
  <text x="72" y="248" text-anchor="middle" class="project-text">medsecure-eu-api</text>
  <rect x="20" y="265" width="105" height="28" rx="4" class="project"/>
  <text x="72" y="283" text-anchor="middle" class="project-text">medsecure-eu-data</text>
  <rect x="20" y="300" width="105" height="28" rx="4" class="project"/>
  <text x="72" y="318" text-anchor="middle" class="project-text">medsecure-eu-ml</text>
  <line class="line" x1="135" y1="204" x2="72" y2="230"/>

  <!-- Service projects under prod-us -->
  <rect x="150" y="230" width="105" height="28" rx="4" class="project"/>
  <text x="202" y="248" text-anchor="middle" class="project-text">medsecure-us-api</text>
  <rect x="150" y="265" width="105" height="28" rx="4" class="project"/>
  <text x="202" y="283" text-anchor="middle" class="project-text">medsecure-us-data</text>
  <rect x="150" y="300" width="105" height="28" rx="4" class="project"/>
  <text x="202" y="318" text-anchor="middle" class="project-text">medsecure-us-ml</text>
  <line class="line" x1="365" y1="204" x2="202" y2="230"/>

  <text x="135" y="350" text-anchor="middle" class="label">gcp.resourceLocations: in:eu-locations</text>
  <text x="365" y="350" text-anchor="middle" class="label" transform="translate(-100,0)">gcp.resourceLocations: in:us-locations</text>

  <!-- Region folders under non-prod (collapsed representation) -->
  <rect x="660" y="170" width="150" height="34" rx="6" class="region-eu" opacity="0.6"/>
  <text x="735" y="192" text-anchor="middle" class="box-text">Folder: eu</text>
  <rect x="820" y="170" width="150" height="34" rx="6" class="region-us" opacity="0.6"/>
  <text x="895" y="192" text-anchor="middle" class="box-text">Folder: us</text>
  <line class="line" x1="750" y1="126" x2="735" y2="170"/>
  <line class="line" x1="750" y1="126" x2="895" y2="170"/>
  <text x="815" y="225" text-anchor="middle" class="label">(same eu/us + service-project pattern as prod)</text>

  <!-- Shared services folder -->
  <rect x="400" y="420" width="200" height="36" rx="6" class="shared"/>
  <text x="500" y="443" text-anchor="middle" class="box-text">Folder: shared-services</text>
  <line class="line" x1="500" y1="50" x2="500" y2="420" stroke-dasharray="4,3"/>

  <rect x="350" y="480" width="140" height="28" rx="4" class="project"/>
  <text x="420" y="498" text-anchor="middle" class="project-text">medsecure-network-hub</text>
  <rect x="510" y="480" width="140" height="28" rx="4" class="project"/>
  <text x="580" y="498" text-anchor="middle" class="project-text">medsecure-logging</text>
  <line class="line" x1="460" y1="456" x2="420" y2="480"/>
  <line class="line" x1="540" y1="456" x2="580" y2="480"/>

  <text x="500" y="530" text-anchor="middle" class="label">Routing/metadata + audit logs only — never customer data, so out of residency scope</text>

  <text x="500" y="580" text-anchor="middle" font-size="12" fill="#455a64">ADR-001: Landing Zone &amp; Resource Hierarchy — Org → Environment → Region → Service Project</text>
</svg>
