<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .pr { fill: #455a64; }
    .plan { fill: #01579b; }
    .nonprod { fill: #2e7d32; }
    .prod { fill: #b71c1c; }
    .box-text { fill: #ffffff; font-size: 12px; font-weight: 600; }
    .label { fill: #607d8b; font-size: 10px; font-style: italic; }
    .arrow { stroke: #90a4ae; stroke-width: 1.8; fill: none; marker-end: url(#arrowhead6); }
  </style>
  <defs>
    <marker id="arrowhead6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#90a4ae"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="220" height="44" rx="6" class="pr"/>
  <text x="150" y="67" text-anchor="middle" class="box-text">PR opens: terraform/&lt;module&gt;/</text>

  <rect x="340" y="40" width="260" height="44" rx="6" class="plan"/>
  <text x="470" y="60" text-anchor="middle" class="box-text">terraform-plan.yml</text>
  <text x="470" y="75" text-anchor="middle" class="box-text" font-size="10">path-filtered: only changed module</text>
  <line class="arrow" x1="260" y1="62" x2="340" y2="62"/>

  <rect x="680" y="40" width="260" height="44" rx="6" fill="#546e7a"/>
  <text x="810" y="67" text-anchor="middle" class="box-text">Plan posted as PR comment</text>
  <line class="arrow" x1="600" y1="62" x2="680" y2="62"/>

  <line class="arrow" x1="810" y1="84" x2="500" y2="140"/>
  <rect x="400" y="140" width="200" height="40" rx="6" fill="#37474f"/>
  <text x="500" y="165" text-anchor="middle" class="box-text">Human reviews, merges to main</text>

  <line class="arrow" x1="500" y1="180" x2="500" y2="220"/>

  <!-- Split -->
  <rect x="200" y="230" width="260" height="44" rx="6" class="nonprod"/>
  <text x="330" y="252" text-anchor="middle" class="box-text">terraform-apply.yml</text>
  <text x="330" y="267" text-anchor="middle" class="box-text" font-size="10">apply-non-prod: AUTO</text>

  <rect x="540" y="230" width="260" height="44" rx="6" class="prod"/>
  <text x="670" y="252" text-anchor="middle" class="box-text">apply-prod: MANUAL APPROVAL</text>
  <text x="670" y="267" text-anchor="middle" class="box-text" font-size="10">GitHub Environment gate</text>

  <line class="arrow" x1="500" y1="220" x2="330" y2="230"/>
  <line class="arrow" x1="500" y1="220" x2="670" y2="230"/>

  <line class="arrow" x1="330" y1="274" x2="330" y2="330"/>
  <rect x="230" y="330" width="200" height="40" rx="6" fill="#66bb6a"/>
  <text x="330" y="355" text-anchor="middle" class="box-text">Non-prod applied</text>

  <line class="arrow" x1="670" y1="274" x2="670" y2="330"/>
  <rect x="570" y="330" width="200" height="40" rx="6" fill="#ef9a9a"/>
  <text x="670" y="349" text-anchor="middle" font-size="11" fill="#b71c1c" font-weight="600">Waits for reviewer</text>
  <text x="670" y="363" text-anchor="middle" font-size="9" fill="#b71c1c">before applying</text>

  <!-- Incident callout -->
  <rect x="30" y="420" width="940" height="110" rx="6" fill="#ffebee" stroke="#b71c1c" stroke-dasharray="4,3"/>
  <text x="50" y="445" font-size="12" font-weight="600" fill="#b71c1c">Why the manual gate exists — not hypothetical</text>
  <text x="50" y="468" font-size="11" fill="#263238">During this build, a terraform apply intended to fix a quota-project setting instead destroyed 14 real</text>
  <text x="50" y="485" font-size="11" fill="#263238">GCP projects — recovered cleanly via Terraform import, zero data loss, but a direct, lived example of why</text>
  <text x="50" y="502" font-size="11" fill="#263238">"just run apply" isn't safe for production without a second, structurally-enforced human review step.</text>
  <text x="50" y="519" font-size="11" fill="#263238">The prod environment gate above is that fix — never remove it to speed up deploys.</text>

  <text x="500" y="555" text-anchor="middle" font-size="12" fill="#455a64">ADR-009: CI/CD &amp; IaC — path-filtered plan-on-PR, auto-apply non-prod, manually-gated prod apply</text>
</svg>
