<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .primary { fill: #2e7d32; }
    .replica { fill: #66bb6a; }
    .monitor { fill: #01579b; }
    .step { fill: #ffffff; stroke: #90a4ae; stroke-width: 1.5; }
    .box-text { fill: #ffffff; font-size: 12px; font-weight: 600; }
    .step-text { fill: #263238; font-size: 11px; }
    .label { fill: #607d8b; font-size: 10px; font-style: italic; }
    .arrow { stroke: #90a4ae; stroke-width: 1.8; fill: none; marker-end: url(#arrowhead4); }
    .oneway { stroke: #b71c1c; stroke-width: 2; fill: none; marker-end: url(#arrowhead5); }
  </style>
  <defs>
    <marker id="arrowhead4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#90a4ae"/>
    </marker>
    <marker id="arrowhead5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b71c1c"/>
    </marker>
  </defs>

  <text x="500" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#263238">EU region (US mirrors identically, independent pairing)</text>

  <!-- Primary and replica -->
  <rect x="60" y="60" width="220" height="44" rx="6" class="primary"/>
  <text x="170" y="87" text-anchor="middle" class="box-text">Primary: medsecure-eu-sql</text>
  <text x="170" y="120" text-anchor="middle" class="label">europe-west1, regional HA</text>

  <rect x="360" y="60" width="220" height="44" rx="6" class="replica"/>
  <text x="470" y="87" text-anchor="middle" class="box-text">DR Replica</text>
  <text x="470" y="120" text-anchor="middle" class="label">europe-west4, failover_target=true</text>

  <line class="arrow" x1="280" y1="82" x2="360" y2="82"/>
  <text x="320" y="72" text-anchor="middle" class="label">continuous</text>
  <text x="320" y="140" text-anchor="middle" class="label">PITR-backed, RPO ≤15min</text>

  <!-- Monitoring -->
  <rect x="680" y="60" width="240" height="44" rx="6" class="monitor"/>
  <text x="800" y="87" text-anchor="middle" class="box-text">Uptime Check (5-min interval)</text>
  <line class="arrow" x1="170" y1="104" x2="750" y2="60"/>

  <!-- Runbook steps -->
  <text x="500" y="185" text-anchor="middle" font-size="13" font-weight="600" fill="#263238">Failover Runbook (docs/dr-drill/failover-runbook.md)</text>

  <rect x="40" y="205" width="150" height="50" rx="4" class="step"/>
  <text x="115" y="225" text-anchor="middle" class="step-text" font-weight="600">1. Detect</text>
  <text x="115" y="242" text-anchor="middle" class="step-text" font-size="9">3 consecutive fails</text>

  <rect x="220" y="205" width="150" height="50" rx="4" class="step"/>
  <text x="295" y="225" text-anchor="middle" class="step-text" font-weight="600">2. Declare</text>
  <text x="295" y="242" text-anchor="middle" class="step-text" font-size="9">Clock starts (RTO)</text>

  <rect x="400" y="205" width="150" height="50" rx="4" fill="#ffebee" stroke="#b71c1c"/>
  <text x="475" y="225" text-anchor="middle" class="step-text" font-weight="600" fill="#b71c1c">3. Promote</text>
  <text x="475" y="242" text-anchor="middle" class="step-text" font-size="9" fill="#b71c1c">ONE-WAY, no undo</text>

  <rect x="580" y="205" width="150" height="50" rx="4" class="step"/>
  <text x="655" y="225" text-anchor="middle" class="step-text" font-weight="600">4. Re-point</text>
  <text x="655" y="242" text-anchor="middle" class="step-text" font-size="9">Scripted, not manual</text>

  <rect x="760" y="205" width="150" height="50" rx="4" class="step"/>
  <text x="835" y="225" text-anchor="middle" class="step-text" font-weight="600">5. Verify</text>
  <text x="835" y="242" text-anchor="middle" class="step-text" font-size="9">Measures actual RPO</text>

  <line class="arrow" x1="190" y1="230" x2="220" y2="230"/>
  <line class="arrow" x1="370" y1="230" x2="400" y2="230"/>
  <line class="oneway" x1="550" y1="230" x2="580" y2="230"/>
  <line class="arrow" x1="730" y1="230" x2="760" y2="230"/>

  <rect x="400" y="290" width="150" height="40" rx="4" fill="#455a64"/>
  <text x="475" y="315" text-anchor="middle" class="box-text">6. Confirm + Record</text>
  <line class="arrow" x1="835" y1="255" x2="475" y2="290"/>

  <!-- Drill status -->
  <rect x="30" y="370" width="940" height="110" rx="6" fill="#fff3e0" stroke="#e65100" stroke-dasharray="4,3"/>
  <text x="50" y="395" font-size="12" font-weight="600" fill="#e65100">Drill status: not yet executed</text>
  <text x="50" y="418" font-size="11" fill="#263238">This runbook has been written and reviewed but not drilled against live infrastructure — the Cloud SQL</text>
  <text x="50" y="435" font-size="11" fill="#263238">instances (ADR-004) have not yet been applied to the sandbox org. The drill log in the runbook document</text>
  <text x="50" y="452" font-size="11" fill="#263238">is intentionally left blank rather than filled with invented numbers. Running a real promotion and recording</text>
  <text x="50" y="469" font-size="11" fill="#263238">actual RTO/RPO is the next concrete step once the data module is applied — see that module's status.</text>

  <text x="500" y="530" text-anchor="middle" font-size="12" fill="#455a64">ADR-007: Reliability &amp; DR — active-passive Cloud SQL failover, documented and ready to drill</text>
</svg>
