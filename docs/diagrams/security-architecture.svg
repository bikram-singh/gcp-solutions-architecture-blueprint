<svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .perimeter-eu { fill: none; stroke: #00695c; stroke-width: 3; stroke-dasharray: 8,4; }
    .perimeter-us { fill: none; stroke: #37474f; stroke-width: 3; stroke-dasharray: 8,4; }
    .project { fill: #ffffff; stroke: #90a4ae; stroke-width: 1.5; }
    .kms { fill: #f9a825; }
    .scc { fill: #6a1b9a; }
    .secret { fill: #c62828; }
    .box-text { fill: #ffffff; font-size: 12px; font-weight: 600; }
    .project-text { fill: #263238; font-size: 11px; }
    .label { fill: #607d8b; font-size: 10px; font-style: italic; }
    .title { fill: #263238; font-size: 13px; font-weight: 600; }
    .no-bridge { stroke: #b71c1c; stroke-width: 2; stroke-dasharray: 3,3; }
  </style>

  <!-- EU Perimeter -->
  <rect x="40" y="50" width="400" height="220" rx="12" class="perimeter-eu"/>
  <text x="240" y="75" text-anchor="middle" class="title" fill="#00695c">VPC-SC Perimeter: prod-eu</text>

  <rect x="70" y="100" width="110" height="34" rx="4" class="project"/>
  <text x="125" y="121" text-anchor="middle" class="project-text">eu-api-prod</text>
  <rect x="195" y="100" width="110" height="34" rx="4" class="project"/>
  <text x="250" y="121" text-anchor="middle" class="project-text">eu-data-prod</text>
  <rect x="320" y="100" width="100" height="34" rx="4" class="project"/>
  <text x="370" y="121" text-anchor="middle" class="project-text">eu-ml-prod</text>

  <rect x="90" y="150" width="200" height="30" rx="4" class="kms"/>
  <text x="190" y="170" text-anchor="middle" class="box-text">CMEK Key Ring (europe-west1)</text>
  <text x="190" y="195" text-anchor="middle" class="label">90-day rotation, prevent_destroy=true</text>

  <text x="240" y="230" text-anchor="middle" class="label">Restricted: BigQuery, Cloud SQL,</text>
  <text x="240" y="245" text-anchor="middle" class="label">Cloud Storage, Vertex AI</text>

  <!-- US Perimeter -->
  <rect x="560" y="50" width="400" height="220" rx="12" class="perimeter-us"/>
  <text x="760" y="75" text-anchor="middle" class="title" fill="#37474f">VPC-SC Perimeter: prod-us</text>

  <rect x="590" y="100" width="110" height="34" rx="4" class="project"/>
  <text x="645" y="121" text-anchor="middle" class="project-text">us-api-prod</text>
  <rect x="715" y="100" width="110" height="34" rx="4" class="project"/>
  <text x="770" y="121" text-anchor="middle" class="project-text">us-data-prod</text>
  <rect x="840" y="100" width="100" height="34" rx="4" class="project"/>
  <text x="890" y="121" text-anchor="middle" class="project-text">us-ml-prod</text>

  <rect x="610" y="150" width="200" height="30" rx="4" class="kms"/>
  <text x="710" y="170" text-anchor="middle" class="box-text">CMEK Key Ring (us-central1)</text>
  <text x="710" y="195" text-anchor="middle" class="label">90-day rotation, prevent_destroy=true</text>

  <text x="760" y="230" text-anchor="middle" class="label">Restricted: BigQuery, Cloud SQL,</text>
  <text x="760" y="245" text-anchor="middle" class="label">Cloud Storage, Vertex AI</text>

  <!-- No bridge -->
  <line x1="440" y1="160" x2="560" y2="160" class="no-bridge"/>
  <text x="500" y="150" text-anchor="middle" font-size="11" fill="#b71c1c" font-weight="600">NO</text>
  <text x="500" y="175" text-anchor="middle" font-size="11" fill="#b71c1c" font-weight="600">bridge</text>

  <!-- Platform-wide services -->
  <text x="500" y="320" text-anchor="middle" class="title">Platform-wide (applies to both perimeters independently)</text>

  <rect x="150" y="350" width="220" height="40" rx="6" class="secret"/>
  <text x="260" y="375" text-anchor="middle" class="box-text">Secret Manager</text>
  <text x="260" y="405" text-anchor="middle" class="label">Automatic rotation, nothing in tfstate</text>

  <rect x="400" y="350" width="220" height="40" rx="6" class="scc"/>
  <text x="510" y="375" text-anchor="middle" class="box-text">Security Command Center Premium</text>
  <text x="510" y="405" text-anchor="middle" class="label">Continuous posture + threat detection</text>

  <rect x="650" y="350" width="220" height="40" rx="6" fill="#455a64"/>
  <text x="760" y="375" text-anchor="middle" class="box-text">Cloud Audit Logs</text>
  <text x="760" y="405" text-anchor="middle" class="label">Admin Activity + Data Access, both enabled</text>

  <line x1="260" y1="390" x2="260" y2="460" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="510" y1="390" x2="510" y2="460" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="760" y1="390" x2="760" y2="460" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#90a4ae"/>
    </marker>
  </defs>

  <rect x="300" y="470" width="400" height="50" rx="6" fill="#37474f"/>
  <text x="500" y="492" text-anchor="middle" class="box-text">medsecure-logging (from ADR-001 shared-services)</text>
  <text x="500" y="510" text-anchor="middle" class="label" fill="#eceff1">One place to review access history platform-wide</text>

  <rect x="30" y="560" width="940" height="90" rx="6" fill="#eceff1" stroke="#b71c1c" stroke-dasharray="4,3"/>
  <text x="50" y="585" font-size="12" font-weight="600" fill="#b71c1c">Why two perimeters, not one</text>
  <text x="50" y="608" font-size="11" fill="#263238">A single global perimeter would protect against external exfiltration but do nothing to stop data moving</text>
  <text x="50" y="625" font-size="11" fill="#263238">between EU and US projects inside it — silently breaking the residency guarantee every other pillar enforces</text>
  <text x="50" y="642" font-size="11" fill="#263238">structurally. Two perimeters with no bridge make any future cross-region need an explicit, reviewed decision.</text>

  <text x="500" y="670" text-anchor="middle" font-size="12" fill="#455a64">ADR-006: Security &amp; Compliance — per-region VPC-SC perimeters + CMEK + Secret Manager + SCC Premium</text>
</svg>
